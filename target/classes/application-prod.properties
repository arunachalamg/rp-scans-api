spring.jpa.hibernate.ddl-auto=validate
server.error.include-message=never
server.error.include-stacktrace=never
# Set true when serving the application via HTTPS; use false only for trusted HTTP LAN testing.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
logging.level.root=WARN
logging.level.com.rpscans.api=INFO
