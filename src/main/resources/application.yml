spring:
  application:
    name: rp-scans-api
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: Asia/Kolkata
  jackson:
    time-zone: Asia/Kolkata
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
