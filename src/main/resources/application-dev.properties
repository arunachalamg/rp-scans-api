spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
logging.level.com.rpscans.api=INFO

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://192.168.1.5:5173

server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/